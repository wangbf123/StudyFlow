name: StudyFlow Integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-dependencies:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: studyflow-it-root
          MYSQL_USER: studyflow
          MYSQL_PASSWORD: studyflow-it-user
          MYSQL_DATABASE: studyflow_pipeline_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pstudyflow-it-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd="curl -fsS http://localhost:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=30
      neo4j:
        image: neo4j:5.26-community@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
        env:
          NEO4J_AUTH: none
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 128m
        ports: ['7687:7687', '7474:7474']
        options: >-
          --health-cmd="cypher-shell -a bolt://localhost:7687 'RETURN 1'"
          --health-interval=10s --health-timeout=10s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: studyflow/pom.xml
      - name: Prepare dedicated schemas
        env:
          MYSQL_PWD: studyflow-it-root
        run: |
          mysql -h 127.0.0.1 -P 3307 -u root -e "CREATE DATABASE studyflow_pipeline_upgrade_test; GRANT ALL ON studyflow_pipeline_upgrade_test.* TO 'studyflow'@'%';"
      - name: Preload pinned offline Python environment
        run: docker pull python@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
      - name: Verify real dependencies and harness protocols
        env:
          EVIDENCE_TEST_DB_PASSWORD: studyflow-it-root
          PIPELINE_TEST_DB_PASSWORD: studyflow-it-user
          STUDYFLOW_ES_INTEGRATION: 'true'
          STUDYFLOW_SANDBOX_TEST_IMAGE: python@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
        run: mvn -B -f studyflow/pom.xml -Dpipeline.mysql.tests=true -Devidence.mysql.tests=true -Dbrain.mysql.tests=true -Dbrain.neo4j.tests=true verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: studyflow/target/surefire-reports/
