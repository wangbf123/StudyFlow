name: StudyFlow Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studyflow-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: studyflow/pom.xml
      - run: mvn -B -f studyflow/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: studyflow/target/surefire-reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studyflow-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studyflow-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: studyflow-web/dist/
