server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: studyflow
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/studyflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: studyflow
    password: studyflow123
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: http://localhost:9200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: studyflow-producer-group
  consumer:
    group: studyflow-parse-consumer-group

studyflow:
  mq:
    # async: no RocketMQ required, good for first local smoke tests.
    # rocketmq: use RocketMQ producer/listener.
    mode: async
    parse-topic: studyflow-parse-task
  minio:
    endpoint: http://localhost:9000
    access-key: studyflow
    secret-key: studyflow123
    bucket: studyflow-docs
  document:
    chunk-size: 1000
    chunk-overlap: 120
  ai:
    # mock: no API key required, keeps the whole RAG flow runnable for interviews.
    # openai-compatible: use any chat-completions compatible provider.
    provider: ${STUDYFLOW_AI_PROVIDER:mock}
    base-url: ${STUDYFLOW_AI_BASE_URL:}
    api-key: ${STUDYFLOW_AI_API_KEY:}
    model: ${STUDYFLOW_AI_MODEL:mock-rag}
    timeout-seconds: 60
    temperature: 0.2
  rag:
    top-k: 6
    max-context-chars: 6000
    citation-preview-chars: 300
  rate-limit:
    enabled: true
    rules:
      - pattern: /api/documents/upload
        capacity: 5
        window-seconds: 60
      - pattern: /api/search
        capacity: 60
        window-seconds: 60
      - pattern: /api/qa/ask
        capacity: 20
        window-seconds: 60
      - pattern: /api/qa/retrieve
        capacity: 60
        window-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true

logging:
  level:
    com.studyflow: info
