server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: studyflow
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/studyflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: studyflow
    password: studyflow123
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: http://localhost:9200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: studyflow-producer-group
  consumer:
    group: studyflow-parse-consumer-group

studyflow:
  pipeline:
    scheduler-delay-ms: ${STUDYFLOW_PIPELINE_DELAY_MS:1000}
    lease-seconds: ${STUDYFLOW_PIPELINE_LEASE_SECONDS:60}
    max-retry-delay-seconds: ${STUDYFLOW_PIPELINE_MAX_RETRY_DELAY:300}
    batch-size: ${STUDYFLOW_PIPELINE_BATCH_SIZE:20}
    chunk-batch-size: ${STUDYFLOW_CHUNK_BATCH_SIZE:64}
    summary-max-chars: ${STUDYFLOW_SUMMARY_MAX_CHARS:12000}
  search:
    index: ${STUDYFLOW_SEARCH_INDEX:studyflow_document_chunk_v2}
    mode: ${STUDYFLOW_SEARCH_MODE:RRF}
    rrf-constant: 60
    knn-candidates: 200
    max-candidates: 200
  mq:
    # rocketmq: upload creates parse_task, producer sends task id, listener consumes and parses.
    # async: local fallback without RocketMQ.
    mode: ${STUDYFLOW_MQ_MODE:rocketmq}
    parse-topic: ${STUDYFLOW_PARSE_TOPIC:studyflow-parse-task}
  minio:
    endpoint: http://localhost:9000
    access-key: studyflow
    secret-key: studyflow123
    bucket: studyflow-docs
  document:
    chunk-size: ${STUDYFLOW_CHUNK_SIZE:400}
    chunk-overlap: ${STUDYFLOW_CHUNK_OVERLAP:60}
  ocr:
    # Normal text PDFs stay on PDFBox; only images and low-text PDF pages call PaddleOCR.
    enabled: ${STUDYFLOW_OCR_ENABLED:true}
    base-url: ${STUDYFLOW_OCR_BASE_URL:http://localhost:8866}
    connect-timeout-seconds: ${STUDYFLOW_OCR_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${STUDYFLOW_OCR_READ_TIMEOUT_SECONDS:180}
    min-text-chars-per-page: ${STUDYFLOW_OCR_MIN_TEXT_CHARS_PER_PAGE:40}
    max-pages: ${STUDYFLOW_OCR_MAX_PAGES:100}
  ai:
    # mock: no API key required, keeps the whole RAG flow runnable locally.
    # openai-compatible: use any chat-completions compatible provider.
    provider: ${STUDYFLOW_AI_PROVIDER:mock}
    base-url: ${STUDYFLOW_AI_BASE_URL:}
    api-key: ${STUDYFLOW_AI_API_KEY:}
    model: ${STUDYFLOW_AI_MODEL:mock-rag}
    timeout-seconds: 60
    temperature: 0.2
  embedding:
    enabled: ${STUDYFLOW_EMBEDDING_ENABLED:true}
    # mock: deterministic local vectors for development and tests.
    # openai-compatible: calls /embeddings on the configured provider.
    provider: ${STUDYFLOW_EMBEDDING_PROVIDER:mock}
    base-url: ${STUDYFLOW_EMBEDDING_BASE_URL:}
    api-key: ${STUDYFLOW_EMBEDDING_API_KEY:}
    model: ${STUDYFLOW_EMBEDDING_MODEL:mock-embedding}
    dimension: ${STUDYFLOW_EMBEDDING_DIMENSION:512}
    batch-size: 16
    max-input-chars: 8000
    timeout-seconds: 60
  rag:
    top-k: 6
    max-context-chars: 6000
    citation-preview-chars: 300
    query-rewrite-enabled: true
    query-rewrite-max-chars: 240
    max-validated-citations: 6
    hybrid-enabled: true
    bm25-candidate-size: 40
    vector-candidate-size: 40
    vector-scan-limit: 1000
    bm25-weight: 0.45
    vector-weight: 0.45
    rerank-weight: 0.10
  graph:
    enabled: ${STUDYFLOW_GRAPH_ENABLED:false}
    uri: ${STUDYFLOW_GRAPH_URI:bolt://127.0.0.1:7687}
    username: ${STUDYFLOW_GRAPH_USERNAME:}
    password: ${STUDYFLOW_GRAPH_PASSWORD:}
  agent:
    enabled: ${STUDYFLOW_AGENT_ENABLED:true}
    # Snapshot per-run budgets; node checkpoints and ordered events live in MySQL.
    max-steps: ${STUDYFLOW_AGENT_MAX_STEPS:6}
    max-model-calls: ${STUDYFLOW_AGENT_MAX_MODEL_CALLS:16}
    max-reported-tokens: ${STUDYFLOW_AGENT_MAX_REPORTED_TOKENS:40000}
    run-timeout-seconds: ${STUDYFLOW_AGENT_RUN_TIMEOUT_SECONDS:300}
    action-timeout-seconds: ${STUDYFLOW_AGENT_ACTION_TIMEOUT_SECONDS:60}
    max-attempts: 3
    max-history-messages: 6
    max-tool-result-chars: 8000
    max-sources: 12
    max-read-chunks: 6
  harness:
    input-tokens: ${STUDYFLOW_HARNESS_INPUT_TOKENS:8000}
    output-tokens: ${STUDYFLOW_HARNESS_OUTPUT_TOKENS:2000}
    artifact-chars: 64000
    max-team-members: 3
    # Optional OTLP gRPC collector; traces are also stored as bounded invocation metadata.
    otlp-endpoint: ${STUDYFLOW_OTLP_ENDPOINT:}
    sandbox-enabled: ${STUDYFLOW_SANDBOX_ENABLED:false}
    sandbox-image: ${STUDYFLOW_SANDBOX_IMAGE:}
    # Server-side model routes and MCP endpoints: docs/agent/harness-architecture.md
    routing: {}
    models: {}
    mcp: {}
  rate-limit:
    enabled: true
    # Token bucket: capacity is max burst tokens; window-seconds is the time to refill capacity tokens.
    rules:
      - pattern: /api/documents/upload
        capacity: 5
        window-seconds: 60
      - pattern: /api/uploads
        capacity: 120
        window-seconds: 60
      - pattern: /api/search
        capacity: 60
        window-seconds: 60
      - pattern: /api/qa/ask
        capacity: 20
        window-seconds: 60
      - pattern: /api/qa/retrieve
        capacity: 60
        window-seconds: 60
      - pattern: /api/agent/runs
        capacity: 12
        window-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true

logging:
  level:
    com.studyflow: info
    io.modelcontextprotocol: warn

# Keep operational endpoints on a separate loopback listener by default.
management:
  server:
    port: ${STUDYFLOW_MANAGEMENT_PORT:9091}
    address: ${STUDYFLOW_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,elasticsearch
        liveness:
          include: livenessState
