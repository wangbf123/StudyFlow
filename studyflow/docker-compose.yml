services:
  mysql:
    image: mysql:8.4
    container_name: studyflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: studyflow
      MYSQL_USER: studyflow
      MYSQL_PASSWORD: studyflow123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - studyflow-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: studyflow-redis
    ports:
      - "6379:6379"
    volumes:
      - studyflow-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: studyflow-minio
    environment:
      MINIO_ROOT_USER: studyflow
      MINIO_ROOT_PASSWORD: studyflow123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - studyflow-minio:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: studyflow-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - studyflow-elasticsearch:/usr/share/elasticsearch/data

  neo4j:
    image: neo4j:5.26-community@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    profiles: [graph]
    environment:
      NEO4J_AUTH: neo4j/${STUDYFLOW_GRAPH_PASSWORD:-studyflow-local-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - studyflow-neo4j:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" 'RETURN 1' >/dev/null
      interval: 10s
      timeout: 10s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: studyflow-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: studyflow-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf

  paddleocr:
    build:
      context: ./ocr-service
    container_name: studyflow-paddleocr
    environment:
      OCR_DEVICE: cpu
      OCR_LANG: ch
      OCR_DPI: 180
      OCR_MAX_FILE_MB: 80
      OCR_MAX_PAGES: 100
      PADDLE_PDX_MODEL_SOURCE: BOS
    ports:
      - "8866:8866"
    shm_size: "1gb"
    volumes:
      - studyflow-paddleocr-models:/root/.paddlex
      - studyflow-paddleocr-cache:/root/.cache

volumes:
  studyflow-neo4j:
  studyflow-mysql:
  studyflow-redis:
  studyflow-minio:
  studyflow-elasticsearch:
  studyflow-paddleocr-models:
  studyflow-paddleocr-cache:
